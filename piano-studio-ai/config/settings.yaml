mode: manual            # manual | auto
videos_per_day: 2
publish_times: ["09:00", "19:00"]
duration_target: 45
duration_range: [35, 55]
styles_allowed: [viral, clean]
languages: [fr, en]
same_song_cooldown_days: 30
qc:
  publish_min: 90
  autofix_min: 80
paths:
  synthesia_app: /Applications/Synthesia.app
  obs_app: /Applications/OBS.app
  data_dir: data
  logs_dir: logs
  database: data/piano.sqlite3
allowed_sources: [user_owned, public_domain, licensed]
score_weights:
  trend: 0.30
  piano: 0.20
  short_video: 0.20
  difficulty: 0.10
  visual: 0.10
  novelty: 0.10

engine: auto            # auto = Synthesia si le Mac est prêt, sinon rendu intégré | synthesia | builtin
synthesia:
  app_path: /Applications/Synthesia.app
  calibrated: false     # passer à true après `piano mac-check` + vérification visuelle d'une vidéo test
  load_seconds: 6       # attente du chargement du MIDI
  lead_in_seconds: 3    # délai (s) entre le début de la capture et la 1re note, à étalonner
  tail_seconds: 2
  play_key_code: 49     # 49 = espace ; 36 = entrée
  capture_trim: 4.0     # secondes à couper au début de la capture (étalonner pour caler l'audio)
