mode: manual            # manual | auto
videos_per_day: 2
publish_times: ["09:00", "19:00"]
duration_target: 62
duration_range: [60, 75]
styles_allowed: [viral, clean]
languages: [fr, en]
same_song_cooldown_days: 30
qc:
  publish_min: 90
  autofix_min: 80
paths:
  synthesia_app: /Applications/Synthesia.app
  obs_app: /Applications/OBS.app
  data_dir: data
  logs_dir: logs
  database: data/piano.sqlite3
allowed_sources: [user_owned, public_domain, licensed]
score_weights:
  trend: 0.30
  piano: 0.20
  short_video: 0.20
  difficulty: 0.10
  visual: 0.10
  novelty: 0.10

engine: auto            # auto = Synthesia si le Mac est prêt, sinon rendu intégré | synthesia | builtin
synthesia:
  app_path: /Applications/Synthesia.app
  calibrated: true      # Synthesia validé sur le Mac de l'utilisateur (clics, enregistrement, montage OK)
  load_seconds: 6       # attente du chargement du MIDI
  lead_in_seconds: 8    # délai (s) entre le début de la capture et la 1re note, à étalonner
  tail_seconds: 2
  start_mode: click      # click = bouton Continuer de l'écran « Regarder et écouter seulement » ; return = touche Entrée
  # positions relevées sur vos captures (px d'une capture plein écran de 2000 px de large), converties selon votre écran
  click_listen_card: false          # la carte est déjà sélectionnée par défaut ; ne cliquer que sur « Continuer »
  listen_card_from_left_px: 165    # carte « Regarder et écouter seulement » (depuis le bord gauche de la fenêtre)
  listen_card_from_top_px: 256
  continue_from_right_px: 88       # bouton « Continuer »
  continue_from_top_px: 71
  titlebar_points: 24
  capture_backend: auto            # auto = ffmpeg si ça marche (arrêt sans perte), sinon l'enregistreur de macOS (screencapture)
  window_mode: maximized    # maximized = fenêtre sur tout l'écran puis zoom sur les touches jouées ; portrait = fenêtre verticale
  portrait: true          # redimensionne la fenêtre Synthesia en vertical (gros plan)
  window_top_points: 40     # sous la barre de menus
  portrait_margin_points: 6
  hide_dock: true           # masque le Dock pendant l'enregistrement (remis ensuite) -> fenêtre plus haute
  capture_trim: 5.5
  first_note_seconds: 2.5   # repli si la détection auto échoue : instant (dans la vidéo) de la 1re note
  crop_toolbar_fraction: 0.12   # masque la barre d'outils de Synthesia     # secondes à couper au début de la capture (étalonner pour caler l'audio)
keyboard:
  keys: 36              # étendue jouée (3 octaves) : la musique est ramenée dans cette plage, l'image zoome dessus
  adaptive: true        # la plage (début = un Do) est choisie selon le morceau
  lowest_key: 48        # utilisé seulement si adaptive: false
  display_keys: 88      # clavier AFFICHÉ par Synthesia (réglage personnalisé de l'utilisateur)
  display_lowest: 21    # première touche affichée (La0 pour un clavier de 88 touches)
midi_sources:
  mutopia: true         # recherche en ligne (domaine public / CC0 / CC-BY) ; repli local si hors-ligne
difficulty:
  mode: rotate              # rotate = alterne les niveaux ; ou un niveau fixe : debutant | facile | moyen | difficile | expert
  rotation: [facile, moyen, difficile]
  levels:                   # tempo cible (BPM) : plus c'est rapide, plus c'est dur ; max_density = notes/s acceptées
    debutant:  {bpm: 60,  max_density: 2.5, label: Débutant}
    facile:    {bpm: 80,  max_density: 4.0, label: Facile}
    moyen:     {bpm: 100, max_density: 6.0, label: Moyen}
    difficile: {bpm: 130, max_density: 9.0, label: Difficile}
    expert:    {bpm: 160, max_density: 14.0, label: Expert}
default_format: vertical
formats:
  vertical:                 # TikTok / YouTube Shorts / Reels : court, 9:16 (durée = duration_target)
    label: "Vertical court (TikTok · YouTube Shorts · Reels)"
    width: 1080
    height: 1920
    banner: 300
    min_duration: 60          # morceaux plus courts écartés (la vidéo doit faire au moins 1 minute)
    shorts: true
  horizontal:               # YouTube long : 16:9, le morceau entier (plafonné)
    label: "Horizontal long (YouTube)"
    width: 1920
    height: 1080
    banner: 130
    duration: full
    min_duration: 60          # au moins 1 minute
    max_duration: 150         # 2 min 30 maximum : pas trop long
    shorts: false
stock:
  target: 3                 # morceaux gardés d'avance (téléchargés et vérifiés en arrière-plan)
ui_default_formats: [vertical, horizontal]   # les deux formats sont créés d'office
