mode: manual            # manual | auto
videos_per_day: 2
publish_times: ["09:00", "19:00"]
duration_target: 62
duration_range: [60, 75]
styles_allowed: [viral, clean]
languages: [fr, en]
same_song_cooldown_days: 30
qc:
  publish_min: 90
  autofix_min: 80
paths:
  synthesia_app: /Applications/Synthesia.app
  obs_app: /Applications/OBS.app
  data_dir: data
  logs_dir: logs
  database: data/piano.sqlite3
allowed_sources: [user_owned, public_domain, licensed]
score_weights:
  trend: 0.30
  piano: 0.20
  short_video: 0.20
  difficulty: 0.10
  visual: 0.10
  novelty: 0.10

engine: auto            # auto = Synthesia si le Mac est prêt, sinon rendu intégré | synthesia | builtin
synthesia:
  app_path: /Applications/Synthesia.app
  calibrated: false     # passer à true après `piano mac-check` + vérification visuelle d'une vidéo test
  load_seconds: 6       # attente du chargement du MIDI
  lead_in_seconds: 3    # délai (s) entre le début de la capture et la 1re note, à étalonner
  tail_seconds: 2
  start_mode: click      # click = bouton Continuer de l'écran « Regarder et écouter seulement » ; return = touche Entrée
  continue_from_right: 56   # points, depuis le bord droit de la fenêtre
  continue_from_top: 45     # points, depuis le haut de la fenêtre (barre de titre incluse)
  titlebar_points: 24
  capture_trim: 4.0     # secondes à couper au début de la capture (étalonner pour caler l'audio)
keyboard:
  keys: 28              # clavier affiché : 28 touches (réglage à faire une fois dans Synthesia)
  lowest_key: 47        # B2 ; la musique est ramenée dans cette plage (47..74)
midi_sources:
  mutopia: true         # recherche en ligne (domaine public / CC0 / CC-BY) ; repli local si hors-ligne
